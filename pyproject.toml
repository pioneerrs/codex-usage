[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-usage-estimator"
version = "0.1.0"
description = "Local CLI for estimating Codex subscription usage from visible transcripts."
readme = "docs/codex-usage-estimator-spec.md"
requires-python = ">=3.9"
dependencies = [
  "tiktoken>=0.7.0",
]

[project.scripts]
codex-usage = "codex_usage.cli:entrypoint"

