[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-usage-estimator"
version = "0.1.0"
description = "Local CLI for Codex token usage reports."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "tiktoken>=0.7.0",
  "tzdata>=2024.1",
  "tzlocal>=5.0",
]

[project.scripts]
codex-usage = "codex_usage.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["codex_usage", "codex_usage.*"]
